<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Fitness Generator - 4-Week Plan</title>
  <style>
    :root { --bg:#f4f4f9; --panel:#fff; --text:#263238; --accent:#247a40;
      --border:#c5cdd2; --week:#245d92; --muted:#eef3f5; }
    .dark-mode { --bg:#121212; --panel:#202124; --text:#f3f5f7;
      --accent:#7aca82; --border:#6b6e70; --week:#2b5878; --muted:#2d3235; }
    * { box-sizing:border-box; }
    body { margin:0; padding:22px; font:16px/1.5 Arial,sans-serif; color:var(--text); background:var(--bg); }
    .container { max-width:1050px; margin:auto; background:var(--panel); border-radius:12px; padding:28px; }
    .topbar { display:flex; justify-content:flex-end; align-items:center; gap:9px; }
    h1 { margin:12px 0 24px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    label { display:block; font-weight:bold; margin-bottom:5px; }
    select,input:not([type=checkbox]) { display:block; width:100%; font:inherit; padding:10px; border:1px solid var(--border); border-radius:6px; color:var(--text); background:var(--panel); }
    .help { font-size:13px; margin-top:3px; opacity:.8; }
    .btn { cursor:pointer; font:inherit; border:0; padding:12px 16px; border-radius:6px; background:var(--accent); color:#fff; font-weight:bold; }
    .primary { width:100%; margin-top:20px; }
    body.dark-mode .btn { color:#122316; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
    .actions .btn { flex:1; }
    [hidden] { display:none !important; }
    .table-scroll { overflow-x:auto; }
    .workout-table { border-collapse:collapse; width:100%; min-width:580px; }
    .workout-table th,.workout-table td { border:1px solid var(--border); padding:9px; text-align:left; vertical-align:top; }
    .workout-table th { background:var(--muted); }
    .week-block { margin:24px 0; background:#fff; color:#212121; padding:12px; border:1px solid #c5cdd2; border-radius:8px; }
    .week-block h2 { background:#245d92; color:#fff; padding:9px; margin:0 0 9px; font-size:20px; }
    .week-block .workout-table th { background:#e7ecf0; }
    .week-block .workout-table td { border-color:#bac3ca; }
    .advisory { border-left:3px solid var(--accent); padding:7px 12px; }
    #formStatus { margin:10px 0; min-height:20px; font-weight:bold; }
    a { color:#156bba; }
    .dark-mode a { color:#98cbff; }
    footer { margin-top:35px; font-size:13px; opacity:.85; }
    @media (max-width:650px) { body { padding:8px; } .container { padding:16px; }
      .form-grid { grid-template-columns:1fr; } .actions { flex-direction:column; } }
  </style>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="container">
    <div class="topbar"><label for="theme-toggle">Dark mode</label><input id="theme-toggle" type="checkbox" aria-label="Enable dark mode"></div>
    <h1>Welcome! Define Your Fitness Goal</h1>
    <form id="fitnessForm" novalidate>
      <div class="form-grid">
        <div><label for="objective">Goal</label><select id="objective" required>
          <option value="">-- Select --</option><option value="lose_weight">Lose Weight</option>
          <option value="gain_muscle">Gain Muscle</option><option value="stay_healthy">Stay Healthy</option></select></div>
        <div><label for="gender">Gender (used for a profile message)</label><select id="gender" required>
          <option value="">-- Select --</option><option value="male">Male</option>
          <option value="female">Female</option><option value="nonbinary">Non-binary</option>
          <option value="undisclosed">Prefer not to say</option></select></div>
        <div><label for="height">Height (cm)</label><input id="height" type="number" required min="120" max="220" step="0.1" placeholder="e.g. 178"></div>
        <div><label for="weight">Weight (kg)</label><input id="weight" type="number" required min="30" max="300" step="0.1" placeholder="e.g. 74"></div>
        <div><label for="age">Age</label><input id="age" type="number" required min="18" max="80" step="1" placeholder="e.g. 18"></div>
        <div><label for="frequency">Training days per week</label><input id="frequency" type="number" required min="1" max="6" step="1" placeholder="e.g. 3"></div>
      </div>
      <button type="submit" class="btn primary">Generate My 4-Week Plan</button>
      <p id="formStatus" role="status" aria-live="polite"></p>
    </form>
    <div id="workoutTableContainer"></div>
    <div id="exerciseVideosContainer"></div>
    <div class="actions" id="extraButtons" hidden>
      <button class="btn" id="downloadPDF" type="button">Download PDF</button>
      <button class="btn" id="openSpotify" type="button">Open Spotify</button>
    </div>
    <footer>Educational beginner workout examples only. Change exercises to suit comfort and seek qualified advice if needed.</footer>
  </main>
</body>
</html>
